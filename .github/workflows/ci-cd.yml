name: CI/CD Pipeline for Gold Price Data Pipeline

on:
    push:
        branches: [dev, "setup/**", "feature/**"]
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    terraform_infra:
        name: Terraform Infrastructure Deployment
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - id: "auth"
              name: "Authenticate to Google Cloud"
              uses: "google-github-actions/auth@v2"
              with:
                  credentials_json: ${{ secrets.GCP_SA_KEY }}

            - name: Set up Cloud SDK
              uses: google-github-actions/setup-gcloud@v2

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "~> 1.0"

            - name: Check secrets
              run: |
                  if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
                    echo "❌ ERROR: GCP_PROJECT_ID secret is not set!"
                    echo "Please add GCP_PROJECT_ID to GitHub Secrets"
                    exit 1
                  else
                    echo "✓ GCP_PROJECT_ID secret found"
                  fi
                  
                  if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
                    echo "❌ ERROR: GCP_SA_KEY secret is not set!"
                    echo "Please add GCP_SA_KEY to GitHub Secrets"
                    exit 1
                  else
                    echo "✓ GCP_SA_KEY secret found"
                  fi

            - name: Create terraform.tfvars
              working-directory: terraform
              env:
                  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
              run: |
                  if [ -z "$PROJECT_ID" ]; then
                    echo "❌ ERROR: PROJECT_ID is empty!"
                    exit 1
                  fi
                  
                  cat > terraform.tfvars <<'TFEOF'
                  project_id   = "${{ secrets.GCP_PROJECT_ID }}"
                  project_name = "gold-price-alert"
                  region       = "asia-southeast2"
                  environment  = "dev"
                  TFEOF
                  
                  echo "✓ terraform.tfvars created with content:"
                  cat terraform.tfvars || echo "Failed to read tfvars"

            - name: Terraform Format Check
              run: terraform -chdir=terraform fmt -check -recursive

            - name: Terraform Init
              run: terraform -chdir=terraform init

            - name: Terraform Validate
              run: terraform -chdir=terraform validate

            - name: Terraform Plan
              run: terraform -chdir=terraform plan -out=tfplan

            - name: Terraform Apply
              if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
              run: terraform -chdir=terraform apply -auto-approve tfplan
