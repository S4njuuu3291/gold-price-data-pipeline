[tool.poetry]
name = "gold-price-data-pipeline"
version = "0.1.0"
description = "Gold price data pipeline with Pub/Sub and Cloud Scheduler"
authors = ["S4njuuu3291 <sanju329121@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
beautifulsoup4 = "^4.14.3"
pywhatkit = "^5.4"
python-dotenv = "^0.19.0"
google-cloud-secret-manager = "^2.26.0"
google-cloud-pubsub = "^2.35.0"
pydantic = "^2.0.0"
tenacity = "^8.0.0"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-mock = "^3.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
